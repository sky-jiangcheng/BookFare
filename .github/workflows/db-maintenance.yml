name: DB maintenance

# 自动执行数据库迁移与检索数据回填：
# - 推送到 main 且涉及脚本变更时
# - 每周一 03:00 UTC（北京时间 11:00）兜底，处理新导入但未回填的数据
# - 支持在 Actions 页面手动触发（首次大批量回填可手动跑，无需 --limit 限制）
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置：
#   POSTGRES_URL  —— Neon 连接串
#   GOOGLE_API_KEY —— Gemini API key（embedding 回填用）

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/db-maintenance.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: db-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate schema (idempotent)
        run: node scripts/vercel/init-db.mjs
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}

      - name: Backfill embeddings (incremental)
        run: node scripts/backfill-embeddings.mjs --limit 5000
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Rebuild book edges (atomic)
        run: node scripts/build-book-edges.mjs
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
